name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # `next build` evaluates postcss.config.mjs, so a payload hidden in a config file
  # runs inside this workflow. Nothing deploys until this passes.
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Scan for hidden payloads
        run: bash scripts/scan-hidden-payloads.sh

  build-and-push:
    needs: security-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/michielstokman-frontend:latest
          build-args: |
            NEXT_PUBLIC_BASE_API=https://api.transformtoliberation.com/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/michielstokman_frontend
            docker compose pull
            docker compose up -d --force-recreate
