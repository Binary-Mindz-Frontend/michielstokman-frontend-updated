services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: softvence/michielstokman-frontend:latest
    container_name: michielstokman-frontend-prod
    ports:
      - "3000:3000"
    restart: always
    # If you need environment variables in production, you can pass them via env_file:
    # env_file:
    #   - .env.production
    # Or define them directly:
    # environment:
    #   - NEXT_PUBLIC_API_URL=https://api.yourdomain.com
